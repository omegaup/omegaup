packages:
  - '.'

minimumReleaseAge: 1440
trustPolicy: no-downgrade
# Ignore trust checks for packages published more than 30 days ago (legacy deps lack provenance).
trustPolicyIgnoreAfter: 43200
strictDepBuilds: true

allowBuilds:
  '@swc/core': true
  bootstrap-vue: true
  core-js: true
  core-js-pure: true
  cypress: true
  deasync: true
  esbuild: true

overrides:
  marked: ^12.0.0
  "loader-utils@2": "2.0.4"
  # vue-jest@3 solo usa este plugin de Babel 6 en una rama que este repo nunca ejecuta
  # (babelConfig inline). Se reemplaza por el equivalente Babel 7 para eliminar babel-traverse@6.
  babel-plugin-transform-es2015-modules-commonjs: "npm:@babel/plugin-transform-modules-commonjs@7.28.6"
